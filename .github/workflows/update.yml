name: Update data and deploy

on:
  schedule:
    # Cada 6 horas, todo el año (en :17: el minuto 0 está saturado y GitHub saltea corridas).
    # Descubre torneos nuevos, baja Oracle's Elixir y reengancha la cadena de 30 minutos de tick.yml en días de partido.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch from Leaguepedia
        run: python -m pipeline.fetch
        env:
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}

      - name: Fetch player stats from Oracle's Elixir (at most once a day; on failure the cached extract is used)
        run: python -m pipeline.fetch_oracles
        continue-on-error: true

      - name: Build site data and freeze new predictions (fails on invalid data, so nothing is deployed)
        run: python -m pipeline.build --freeze

      - name: Commit raw data, frozen predictions and new team logos if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/predictions.jsonl web/public/img
          git diff --cached --quiet || (git commit -m "data: update season data" && git push)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
